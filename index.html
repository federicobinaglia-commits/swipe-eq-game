<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Algebra Reactor - Challenger Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; touch-action: none; background-color: #f8fafc; font-family: system-ui, sans-serif; }
        #root { width: 100vw; height: 100vh; }
        .glass-clean { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(6px); border: 2px solid white; }
        .card-shadow { box-shadow: 0 8px 20px -4px rgba(0,0,0,0.15); }
        .score-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; color: #ef4444 !important; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = window.FramerMotion || window.Motion;

        const LHS_BG = '#E0F7FA'; const RHS_BG = '#FFF9C4';
        const LHS_CARD = '#4FC3F7'; const RHS_CARD = '#FFD54F';
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const formatForCard = (coeff, hasVar) => {
            const abs = Math.abs(coeff);
            const sign = coeff >= 0 ? "+" : "-";
            const v = hasVar ? "x" : "";
            const c = (abs === 1 && hasVar) ? "" : abs;
            return `${sign}${c}${v}`;
        };

        const formatForEq = (coeff, hasVar, first) => {
            const abs = Math.abs(coeff);
            const v = hasVar ? "x" : "";
            const c = (abs === 1 && hasVar) ? "" : abs;
            if (coeff === 0) return "";
            if (coeff > 0) return first ? `${c}${v}` : ` + ${c}${v}`;
            return first ? `-${c}${v}` : ` - ${c}${v}`;
        };

        const generateLevel = () => {
            let fCoeff = [2, 3, 4, 5, -2, -3][Math.floor(Math.random()*6)];
            let ans = 0; while(ans === 0) ans = Math.floor(Math.random() * 7) - 3; 
            const A = Math.floor(Math.random() * 3) + 4; 
            const B = A - fCoeff;
            let C1 = 0; while(C1 === 0) C1 = Math.floor(Math.random() * 6) - 3;
            let C2 = C1 + (fCoeff * ans);
            if (C2 === 0) { C1 += 1; C2 = C1 + (fCoeff * ans); }
            return [
                { id: generateId(), coefficient: A, hasVariable: true, side: 'lhs' },
                { id: generateId(), coefficient: B, hasVariable: true, side: 'rhs' },
                { id: generateId(), coefficient: C1, hasVariable: false, side: 'lhs' },
                { id: generateId(), coefficient: C2, hasVariable: false, side: 'rhs' }
            ];
        };

        function App() {
            const [terms, setTerms] = useState([]);
            const [score, setScore] = useState(0);
            const [shakeScore, setShakeScore] = useState(false);
            const [gameWon, setGameWon] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, termA: null, termB: null, val: '' });
            const [divModal, setDivModal] = useState({ isOpen: false, divisor: 1, dividend: 0, dIn: '', rIn: '' });

            useEffect(() => { setTerms(generateLevel()); }, []);

            const triggerMalus = (amount) => {
                setScore(prev => Math.max(0, prev - amount));
                setShakeScore(true);
                setTimeout(() => setShakeScore(false), 500);
            };

            const equationString = useMemo(() => {
                const lhs = terms.filter(t => t.side === 'lhs');
                const rhs = terms.filter(t => t.side === 'rhs');
                const fmt = (list) => list.length === 0 ? "0" : list.map((t, i) => formatForEq(t.coefficient, t.hasVariable, i === 0)).join('');
                return `${fmt(lhs)} = ${fmt(rhs)}`;
            }, [terms]);

            const canDivide = useMemo(() => {
                if (gameWon || terms.length !== 2) return null;
                const v = terms.find(t => t.hasVariable);
                const c = terms.find(t => !t.hasVariable);
                if (v && c && v.coefficient !== 1) return { divisor: v.coefficient, dividend: c.coefficient };
                return null;
            }, [terms, gameWon]);

            useEffect(() => {
                const v = terms.find(t => t.hasVariable);
                if (terms.length === 2 && v?.coefficient === 1 && !gameWon) {
                    setGameWon(true);
                    setScore(prev => prev + 50); // Bonus vittoria
                }
            }, [terms]);

            const handleDragEnd = (term, info, element) => {
                const center = window.innerWidth / 2;
                const newSide = info.point.x < center ? 'lhs' : 'rhs';
                const rect = element.getBoundingClientRect();
                const overlap = terms.find(t => {
                    if (t.id === term.id || t.side !== newSide || t.hasVariable !== term.hasVariable) return false;
                    const target = document.getElementById(`card-${t.id}`)?.getBoundingClientRect();
                    return target && !(rect.right < target.left || rect.left > target.right || rect.bottom < target.top || rect.top > target.bottom);
                });

                if (overlap) {
                    setModal({ 
                        isOpen: true, 
                        termA: {...term, coefficient: newSide !== term.side ? -term.coefficient : term.coefficient, side: newSide}, 
                        termB: overlap, 
                        val: '' 
                    });
                } else if (newSide !== term.side) {
                    setTerms(prev => prev.map(t => t.id === term.id ? { ...t, side: newSide, coefficient: -t.coefficient } : t));
                }
            };

            return (
                <div className="relative w-full h-full overflow-hidden">
                    <div className="absolute inset-0 flex">
                        <div className="w-1/2 h-full" style={{backgroundColor: LHS_BG}} />
                        <div className="w-1/2 h-full" style={{backgroundColor: RHS_BG}} />
                    </div>

                    {/* SCORE UI */}
                    <div className="absolute top-4 right-6 z-[70]">
                        <div className={`bg-white/90 backdrop-blur px-6 py-2 rounded-2xl shadow-md border border-white transition-all ${shakeScore ? 'score-shake' : ''}`}>
                            <span className="text-xs font-bold text-slate-400 uppercase tracking-tighter block leading-none">Punti</span>
                            <span className="text-2xl font-black text-slate-700">{score}</span>
                        </div>
                    </div>

                    <div className="absolute top-8 w-full flex flex-col items-center z-[60] pointer-events-none px-4 text-center">
                        <div className="bg-white/80 backdrop-blur px-10 py-4 rounded-3xl shadow-lg border border-white">
                            <span className="text-3xl font-black font-mono tracking-tight text-slate-700 italic">
                                {equationString}
                            </span>
                        </div>
                    </div>

                    {terms.map(t => ( <Card key={t.id} term={t} onDragEnd={handleDragEnd} colors={{lhs: LHS_CARD, rhs: RHS_CARD}} /> ))}

                    <div className="absolute left-1/2 inset-y-0 w-1 bg-white/40 flex items-center justify-center pointer-events-none">
                        <div className="bg-white text-slate-300 w-10 h-10 rounded-full flex items-center justify-center font-bold shadow-sm border-2 border-slate-50 text-xl">=</div>
                    </div>

                    <AnimatePresence>
                        {canDivide && (
                            <motion.button initial={{scale:0}} animate={{scale:1}} exit={{scale:0}}
                                onClick={() => setDivModal({isOpen:true, divisor: canDivide.divisor, dividend: canDivide.dividend, dIn:'', rIn:''})}
                                className="absolute bottom-12 left-1/2 -translate-x-1/2 z-50 bg-green-500 text-white px-14 py-5 rounded-full font-black text-2xl shadow-xl animate-bounce border-4 border-white"
                            >
                                RISOLVI ÷
                            </motion.button>
                        )}
                    </AnimatePresence>

                    {/* Divisione con Malus */}
                    <AnimatePresence>
                        {divModal.isOpen && (
                            <div className="absolute inset-0 z-[100] flex items-center justify-center p-6 pointer-events-none bg-white/5 backdrop-blur-[1px]">
                                <motion.div initial={{y:50}} animate={{y:0}} className="glass-clean p-10 rounded-[4rem] shadow-2xl w-full max-w-sm text-center pointer-events-auto border-4 border-white">
                                    <h2 className="text-2xl font-black mb-1 text-slate-700">Dividi per {divModal.divisor}</h2>
                                    <p className="text-[10px] font-bold text-red-400 mb-6 uppercase tracking-widest leading-none">Attento: Errore = -20 Punti!</p>
                                    <div className="space-y-4 mb-8">
                                        <input type="number" placeholder="Divisore" className="w-full p-4 rounded-2xl border-2 border-slate-100 text-center text-xl font-bold bg-white outline-none"
                                               value={divModal.dIn} onChange={e => setDivModal({...divModal, dIn: e.target.value})} />
                                        <div className="flex items-center justify-center text-4xl font-black text-green-500">
                                            <span className="mr-2 italic">x =</span>
                                            <input type="number" placeholder="?" className="w-24 text-center bg-transparent border-b-4 border-green-500 outline-none"
                                                   value={divModal.rIn} onChange={e => setDivModal({...divModal, rIn: e.target.value})} />
                                        </div>
                                    </div>
                                    <button onClick={() => {
                                        if(parseInt(divModal.dIn) === divModal.divisor && parseInt(divModal.rIn) === (divModal.dividend / divModal.divisor)) {
                                            setTerms(prev => prev.map(t => ({...t, coefficient: t.hasVariable ? 1 : (divModal.dividend / divModal.divisor)})));
                                            setDivModal({isOpen:false});
                                        } else { triggerMalus(20); }
                                    }} className="w-full bg-green-500 text-white py-5 rounded-3xl font-black text-xl shadow-lg">CONFERMA</button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* Fusion con Malus */}
                    <AnimatePresence>
                        {modal.isOpen && (
                            <div className="absolute inset-0 z-[100] bg-white/10 backdrop-blur-sm flex items-center justify-center">
                                <motion.div initial={{scale:0.8}} animate={{scale:1}} className="bg-white p-10 rounded-[3rem] shadow-2xl w-80 text-center border-4 border-blue-50">
                                    <p className="text-[10px] font-bold text-red-400 mb-2 uppercase tracking-widest">Errore = -5 Punti</p>
                                    <div className="text-4xl font-black text-blue-500 mb-8 bg-blue-50/50 py-8 rounded-[2rem]">
                                        {formatForCard(modal.termA.coefficient, modal.termA.hasVariable)} {modal.termB.coefficient >= 0 ? "+" : ""} {formatForCard(modal.termB.coefficient, modal.termB.hasVariable).replace('+', '')}
                                    </div>
                                    <input autoFocus type="number" className="w-full bg-slate-50 p-6 rounded-3xl mb-6 text-center text-5xl font-black outline-none border-2 border-slate-100" 
                                           value={modal.val} onChange={e => setModal({...modal, val: e.target.value})} />
                                    <button onClick={() => {
                                        const sum = parseInt(modal.val);
                                        if(sum === (modal.termA.coefficient + modal.termB.coefficient)) {
                                            setScore(prev => prev + 10);
                                            setTerms(prev => {
                                                const filtered = prev.filter(t => t.id !== modal.termA.id && t.id !== modal.termB.id);
                                                return sum === 0 ? filtered : [...filtered, {id: generateId(), coefficient: sum, hasVariable: modal.termA.hasVariable, side: modal.termA.side}];
                                            });
                                            setModal({isOpen:false});
                                        } else { triggerMalus(5); }
                                    }} className="w-full bg-blue-500 text-white py-5 rounded-3xl font-black text-xl">COMBINA</button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    <AnimatePresence>
                        {gameWon && (
                            <motion.div initial={{opacity:0}} animate={{opacity:1}} className="absolute inset-0 z-[300] bg-green-400/90 flex items-center justify-center text-white text-center">
                                <div>
                                    <h1 className="text-9xl font-black italic mb-10 tracking-tighter drop-shadow-lg">BOOM!</h1>
                                    <button onClick={() => { setGameWon(false); setTerms(generateLevel()); }}
                                            className="bg-white text-green-500 px-20 py-8 rounded-[2.5rem] font-black text-4xl shadow-2xl">AVANTI</button>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        function Card({ term, onDragEnd, colors }) {
            const isL = term.side === 'lhs';
            const pos = useMemo(() => ({
                x: isL ? 70 + Math.random()*70 : window.innerWidth - 180 - Math.random()*70,
                y: 220 + Math.random() * (window.innerHeight - 480)
            }), [term.side]);

            return (
                <motion.div
                    id={`card-${term.id}`}
                    drag dragMomentum={false}
                    initial={{ x: pos.x, y: pos.y, scale: 0 }}
                    animate={{ x: pos.x, y: pos.y, scale: 1, backgroundColor: isL ? colors.lhs : colors.rhs }}
                    whileDrag={{ scale: 1.1, zIndex: 100 }}
                    onDragEnd={(e, info) => onDragEnd(term, info, e.target)}
                    className="absolute w-24 h-24 rounded-[2.5rem] card-shadow flex items-center justify-center text-white text-3xl font-black cursor-grab border-b-8 border-black/10"
                >
                    {formatForCard(term.coefficient, term.hasVariable)}
                </motion.div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
