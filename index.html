<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Algebra Reactor - Final Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; touch-action: none; background-color: #0f172a; font-family: sans-serif; }
        #root { width: 100vw; height: 100vh; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = window.FramerMotion || window.Motion;

        const LHS_BG = '#E3F2FD'; const RHS_BG = '#FFFDE7';
        const LHS_CARD_BG = '#2196F3'; const RHS_CARD_BG = '#FBC02D';
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const formatTerm = (coeff, hasVar, showSign = true) => {
            if (coeff === 0) return "0";
            const abs = Math.abs(coeff);
            const sign = coeff >= 0 ? "+" : "-";
            const v = hasVar ? "x" : "";
            const c = (abs === 1 && hasVar) ? "" : abs;
            return `${showSign ? sign : (coeff < 0 ? "-" : "")}${c}${v}`;
        };

        const generateLevel = (diff) => {
            const scale = (v) => Math.round(v * diff);
            // Forza un coefficiente diverso da 1 se la difficoltà è > 1
            let finalCoeff = diff > 1 ? [2, 3, 5, -2, -3][Math.floor(Math.random()*5)] : 1;
            const answer = Math.floor(Math.random() * 11) - 5; // x tra -5 e 5
            const A = Math.floor(Math.random() * 4) + 2; 
            const B = A - finalCoeff;
            const C1 = Math.floor(Math.random() * 10) - 5;
            const C2 = C1 + (finalCoeff * answer);

            return [
                { id: generateId(), coefficient: A, hasVariable: true, side: 'lhs' },
                { id: generateId(), coefficient: B, hasVariable: true, side: 'rhs' },
                { id: generateId(), coefficient: C1, hasVariable: false, side: 'lhs' },
                { id: generateId(), coefficient: C2, hasVariable: false, side: 'rhs' }
            ];
        };

        function App() {
            const [terms, setTerms] = useState([]);
            const [score, setScore] = useState(0);
            const [solvedCount, setSolvedCount] = useState(0);
            const [gameWon, setGameWon] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, termA: null, termB: null, val: '' });
            const [divModal, setDivModal] = useState({ isOpen: false, divisor: 1, dividend: 0, dIn: '', rIn: '' });

            useEffect(() => { setTerms(generateLevel(1)); }, []);

            // LOGICA DI VITTORIA E DIVISIONE MIGLIORATA
            const canDivide = useMemo(() => {
                if (gameWon || terms.length !== 2) return null;
                const lhs = terms.filter(t => t.side === 'lhs');
                const rhs = terms.filter(t => t.side === 'rhs');
                if (lhs.length === 1 && rhs.length === 1) {
                    const t1 = lhs[0]; const t2 = rhs[0];
                    // Caso 1: Ax = B
                    if (t1.hasVariable && !t2.hasVariable && t1.coefficient !== 1) 
                        return { divisor: t1.coefficient, dividend: t2.coefficient };
                    // Caso 2: B = Ax
                    if (!t1.hasVariable && t2.hasVariable && t2.coefficient !== 1) 
                        return { divisor: t2.coefficient, dividend: t1.coefficient };
                }
                return null;
            }, [terms, gameWon]);

            useEffect(() => {
                if (gameWon) return;
                // Controllo vittoria immediata (x = n)
                if (terms.length === 2) {
                    const lhs = terms.filter(t => t.side === 'lhs');
                    const rhs = terms.filter(t => t.side === 'rhs');
                    if (lhs.length === 1 && rhs.length === 1) {
                        const v = lhs[0].hasVariable ? lhs[0] : rhs[0];
                        const c = lhs[0].hasVariable ? rhs[0] : lhs[0];
                        if (v.hasVariable && !c.hasVariable && v.coefficient === 1) {
                            setGameWon(true); setScore(s => s + 10); setSolvedCount(c => c + 1);
                        }
                    }
                }
            }, [terms]);

            const handleDragEnd = (term, info, element) => {
                const center = window.innerWidth / 2;
                const newSide = info.point.x < center ? 'lhs' : 'rhs';
                const rect = element.getBoundingClientRect();
                
                const overlap = terms.find(t => {
                    if (t.id === term.id || t.side !== newSide || t.hasVariable !== term.hasVariable) return false;
                    const target = document.getElementById(`card-${t.id}`)?.getBoundingClientRect();
                    return target && !(rect.right < target.left || rect.left > target.right || rect.bottom < target.top || rect.top > target.bottom);
                });

                if (overlap) {
                    setModal({ isOpen: true, termA: {...term, coefficient: newSide !== term.side ? -term.coefficient : term.coefficient, side: newSide}, termB: overlap, val: '' });
                } else if (newSide !== term.side) {
                    setTerms(prev => prev.map(t => t.id === term.id ? { ...t, side: newSide, coefficient: -t.coefficient } : t));
                }
            };

            return (
                <div className="relative w-full h-full overflow-hidden font-sans">
                    <div className="absolute inset-0 flex">
                        <div className="w-1/2 h-full" style={{backgroundColor: LHS_BG}} />
                        <div className="w-1/2 h-full" style={{backgroundColor: RHS_BG}} />
                    </div>

                    <div className="absolute top-6 w-full flex flex-col items-center z-50 pointer-events-none">
                        <div className="bg-slate-900 text-white px-6 py-2 rounded-full shadow-2xl flex gap-4 font-bold">
                            <span>PUNTI: {score}</span>
                            <span className="opacity-50">|</span>
                            <span>LIVELLO: {solvedCount + 1}</span>
                        </div>
                    </div>

                    {terms.map(t => (
                        <Card key={t.id} term={t} onDragEnd={handleDragEnd} />
                    ))}

                    <div className="absolute left-1/2 inset-y-0 w-1 bg-black/10 flex items-center justify-center">
                        <div className="bg-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center font-bold text-slate-400">=</div>
                    </div>

                    {/* TASTO DIVISIONE */}
                    <AnimatePresence>
                        {canDivide && (
                            <motion.div initial={{y:100}} animate={{y:0}} exit={{y:100}} className="absolute bottom-10 left-1/2 -translate-x-1/2 z-50">
                                <button onClick={() => setDivModal({isOpen:true, divisor: canDivide.divisor, dividend: canDivide.dividend, dIn:'', rIn:''})}
                                        className="bg-purple-600 text-white px-10 py-4 rounded-2xl font-black text-xl shadow-[0_0_30px_rgba(147,51,234,0.5)] border-4 border-white animate-pulse">
                                    DIVIDI PER {canDivide.divisor}
                                </button>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* MODALE DIVISIONE */}
                    <AnimatePresence>
                        {divModal.isOpen && (
                            <div className="absolute inset-0 z-[100] bg-purple-900/80 backdrop-blur flex items-center justify-center">
                                <motion.div initial={{scale:0.8}} animate={{scale:1}} className="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-xs text-center">
                                    <h2 className="font-bold text-purple-600 mb-6">ULTIMO STEP!</h2>
                                    <p className="text-slate-500 mb-4 text-sm">Dividi entrambi i lati per {divModal.divisor}</p>
                                    <input type="number" placeholder="Divisore" className="w-full bg-slate-100 p-4 rounded-xl mb-2 text-center font-bold"
                                           value={divModal.dIn} onChange={e => setDivModal({...divModal, dIn: e.target.value})} />
                                    <input type="number" placeholder="Risultato" className="w-full bg-slate-100 p-4 rounded-xl mb-4 text-center font-bold"
                                           value={divModal.rIn} onChange={e => setDivModal({...divModal, rIn: e.target.value})} />
                                    <button onClick={() => {
                                        if(parseInt(divModal.dIn) === divModal.divisor && parseInt(divModal.rIn) === (divModal.dividend / divModal.divisor)) {
                                            setTerms(prev => prev.map(t => ({...t, coefficient: t.hasVariable ? 1 : (divModal.dividend / divModal.divisor)})));
                                            setDivModal({isOpen:false});
                                        }
                                    }} className="w-full bg-purple-600 text-white py-4 rounded-xl font-bold">CONFERMA</button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* MODALE MERGE */}
                    <AnimatePresence>
                        {modal.isOpen && (
                            <div className="absolute inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center">
                                <div className="bg-white p-8 rounded-[2.5rem] shadow-2xl w-80 text-center">
                                    <div className="text-3xl font-black text-blue-600 mb-6 italic">
                                        {formatTerm(modal.termA.coefficient, modal.termA.hasVariable)} {modal.termB.coefficient >= 0 ? "+" : ""} {formatTerm(modal.termB.coefficient, modal.termB.hasVariable, false)}
                                    </div>
                                    <input autoFocus type="number" className="w-full bg-slate-100 p-4 rounded-2xl mb-4 text-center text-3xl font-bold" 
                                           value={modal.val} onChange={e => setModal({...modal, val: e.target.value})} />
                                    <button onClick={() => {
                                        if(parseInt(modal.val) === (modal.termA.coefficient + modal.termB.coefficient)) {
                                            setTerms(prev => [...prev.filter(t => t.id !== modal.termA.id && t.id !== modal.termB.id), 
                                                             {id: generateId(), coefficient: parseInt(modal.val), hasVariable: modal.termA.hasVariable, side: modal.termA.side}]);
                                            setModal({isOpen:false});
                                        }
                                    }} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-xl">FUSION!</button>
                                </div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* MODALE VITTORIA */}
                    <AnimatePresence>
                        {gameWon && (
                            <div className="absolute inset-0 z-[200] bg-green-500 flex items-center justify-center">
                                <motion.div initial={{scale:0}} animate={{scale:1.2}} className="text-center text-white">
                                    <h1 className="text-6xl font-black mb-4 uppercase tracking-tighter">Perfetto!</h1>
                                    <p className="text-2xl mb-8 opacity-80">Hai trovato la X</p>
                                    <button onClick={() => { setGameWon(false); setTerms(generateLevel(1 + (solvedCount+1)*0.2)); }}
                                            className="bg-white text-green-600 px-12 py-4 rounded-full font-black text-2xl shadow-2xl">AVANTI</button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        function Card({ term, onDragEnd }) {
            const isL = term.side === 'lhs';
            const pos = useMemo(() => ({
                x: isL ? 60 + Math.random()*100 : window.innerWidth - 180 - Math.random()*100,
                y: 180 + Math.random() * (window.innerHeight - 350)
            }), [term.side]);

            return (
                <motion.div
                    id={`card-${term.id}`}
                    drag dragMomentum={false}
                    initial={{ x: pos.x, y: pos.y, scale: 0 }}
                    animate={{ x: pos.x, y: pos.y, scale: 1, backgroundColor: isL ? LHS_CARD_BG : RHS_CARD_BG }}
                    onDragEnd={(e, info) => onDragEnd(term, info, e.target)}
                    className="absolute w-24 h-24 rounded-[2rem] card-shadow flex items-center justify-center text-white text-3xl font-black cursor-grab active:cursor-grabbing border-b-8 border-black/20"
                >
                    {formatTerm(term.coefficient, term.hasVariable, false)}
                </motion.div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
