<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Algebra Reactor - Smart Division</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; touch-action: none; background-color: #0f172a; font-family: 'Segoe UI', Roboto, sans-serif; }
        #root { width: 100vw; height: 100vh; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = window.FramerMotion || window.Motion;

        const LHS_BG = '#E3F2FD'; const RHS_BG = '#FFFDE7';
        const LHS_CARD_BG = '#2196F3'; const RHS_CARD_BG = '#FBC02D';
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const formatTerm = (coeff, hasVar, showSign = true) => {
            if (coeff === 0) return "0";
            const abs = Math.abs(coeff);
            const sign = coeff >= 0 ? "+" : "-";
            const v = hasVar ? "x" : "";
            const c = (abs === 1 && hasVar) ? "" : abs;
            return `${showSign ? sign : (coeff < 0 ? "-" : "")}${c}${v}`;
        };

        const generateLevel = (diff) => {
            let finalCoeff = [2, 3, 4, 5, -2, -3][Math.floor(Math.random()*6)];
            const answer = Math.floor(Math.random() * 11) - 5; 
            const A = Math.floor(Math.random() * 3) + 6; 
            const B = A - finalCoeff;
            const C1 = Math.floor(Math.random() * 10) - 5;
            const C2 = C1 + (finalCoeff * answer);

            return [
                { id: generateId(), coefficient: A, hasVariable: true, side: 'lhs' },
                { id: generateId(), coefficient: B, hasVariable: true, side: 'rhs' },
                { id: generateId(), coefficient: C1, hasVariable: false, side: 'lhs' },
                { id: generateId(), coefficient: C2, hasVariable: false, side: 'rhs' }
            ];
        };

        function App() {
            const [terms, setTerms] = useState([]);
            const [score, setScore] = useState(0);
            const [gameWon, setGameWon] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, termA: null, termB: null, val: '' });
            const [divModal, setDivModal] = useState({ isOpen: false, divisor: 1, dividend: 0, dIn: '', rIn: '' });

            useEffect(() => { setTerms(generateLevel(1)); }, []);

            const canDivide = useMemo(() => {
                if (gameWon || terms.length !== 2) return null;
                const lhs = terms.filter(t => t.side === 'lhs');
                const rhs = terms.filter(t => t.side === 'rhs');
                if (lhs.length === 1 && rhs.length === 1) {
                    const v = lhs[0].hasVariable ? lhs[0] : (rhs[0].hasVariable ? rhs[0] : null);
                    const c = lhs[0].hasVariable ? rhs[0] : (lhs[0].hasVariable ? null : lhs[0]);
                    if (v && c && !c.hasVariable && v.coefficient !== 1 && v.coefficient !== 0) {
                        return { divisor: v.coefficient, dividend: c.coefficient };
                    }
                }
                return null;
            }, [terms, gameWon]);

            useEffect(() => {
                if (gameWon) return;
                if (terms.length === 2) {
                    const v = terms.find(t => t.hasVariable);
                    const c = terms.find(t => !t.hasVariable);
                    if (v && c && v.coefficient === 1) {
                        setGameWon(true); setScore(s => s + 10);
                    }
                }
            }, [terms]);

            const handleDragEnd = (term, info, element) => {
                const center = window.innerWidth / 2;
                const newSide = info.point.x < center ? 'lhs' : 'rhs';
                const rect = element.getBoundingClientRect();
                const overlap = terms.find(t => {
                    if (t.id === term.id || t.side !== newSide || t.hasVariable !== term.hasVariable) return false;
                    const target = document.getElementById(`card-${t.id}`)?.getBoundingClientRect();
                    return target && !(rect.right < target.left || rect.left > target.right || rect.bottom < target.top || rect.top > target.bottom);
                });

                if (overlap) {
                    setModal({ isOpen: true, termA: {...term, coefficient: newSide !== term.side ? -term.coefficient : term.coefficient, side: newSide}, termB: overlap, val: '' });
                } else if (newSide !== term.side) {
                    setTerms(prev => prev.map(t => t.id === term.id ? { ...t, side: newSide, coefficient: -t.coefficient } : t));
                }
            };

            return (
                <div className="relative w-full h-full overflow-hidden">
                    <div className="absolute inset-0 flex">
                        <div className="w-1/2 h-full" style={{backgroundColor: LHS_BG}} />
                        <div className="w-1/2 h-full" style={{backgroundColor: RHS_BG}} />
                    </div>

                    <div className="absolute top-6 w-full flex justify-center z-50 pointer-events-none">
                        <div className="bg-slate-900 text-white px-8 py-3 rounded-full shadow-2xl font-bold border-2 border-white/20">
                            SCORE: {score}
                        </div>
                    </div>

                    {terms.map(t => ( <Card key={t.id} term={t} onDragEnd={handleDragEnd} /> ))}

                    <div className="absolute left-1/2 inset-y-0 w-1 bg-black/10 flex items-center justify-center">
                        <div className="bg-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center font-bold text-2xl text-slate-300 border-2 border-slate-50">=</div>
                    </div>

                    {/* PULSANTE DIVISIONE CORRETTO */}
                    <AnimatePresence>
                        {canDivide && (
                            <motion.button 
                                initial={{y:100}} animate={{y:0}} exit={{y:100}}
                                onClick={() => setDivModal({isOpen:true, divisor: canDivide.divisor, dividend: canDivide.dividend, dIn:'', rIn:''})}
                                className="absolute bottom-12 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white px-12 py-5 rounded-3xl font-black text-2xl shadow-2xl border-4 border-indigo-200 animate-bounce active:scale-95 transition-transform"
                            >
                                ISOLA LA X ÷
                            </motion.button>
                        )}
                    </AnimatePresence>

                    {/* MODALE DIVISIONE CHIARO */}
                    <AnimatePresence>
                        {divModal.isOpen && (
                            <div className="absolute inset-0 z-[200] bg-indigo-950/90 backdrop-blur-md flex items-center justify-center p-4">
                                <motion.div initial={{scale:0.9, opacity:0}} animate={{scale:1, opacity:1}} className="bg-white p-8 rounded-[3rem] shadow-2xl w-full max-w-sm border-8 border-indigo-100">
                                    <h2 className="text-2xl font-black text-indigo-900 mb-2 text-center">FASE FINALE</h2>
                                    <p className="text-slate-500 text-center mb-8 font-medium">Dividi tutto per il numero davanti alla x</p>
                                    
                                    <div className="flex flex-col gap-6 mb-8">
                                        <div className="flex items-center gap-4 justify-center bg-indigo-50 p-4 rounded-2xl">
                                            <span className="text-2xl font-bold text-indigo-400">Dividi per:</span>
                                            <input type="number" placeholder="?" className="w-20 p-3 rounded-xl border-2 border-indigo-200 text-center text-2xl font-black text-indigo-600 outline-none focus:border-indigo-500"
                                                   value={divModal.dIn} onChange={e => setDivModal({...divModal, dIn: e.target.value})} />
                                        </div>
                                        <div className="flex items-center gap-4 justify-center bg-green-50 p-4 rounded-2xl">
                                            <span className="text-2xl font-bold text-green-400 font-mono italic">x = </span>
                                            <input type="number" placeholder="Risultato" className="w-32 p-3 rounded-xl border-2 border-green-200 text-center text-2xl font-black text-green-600 outline-none focus:border-green-500"
                                                   value={divModal.rIn} onChange={e => setDivModal({...divModal, rIn: e.target.value})} />
                                        </div>
                                    </div>

                                    <button onClick={() => {
                                        const isDCorrect = parseInt(divModal.dIn) === divModal.divisor;
                                        const isRCorrect = parseInt(divModal.rIn) === (divModal.dividend / divModal.divisor);
                                        if(isDCorrect && isRCorrect) {
                                            setTerms(prev => prev.map(t => ({...t, coefficient: t.hasVariable ? 1 : (divModal.dividend / divModal.divisor)})));
                                            setDivModal({isOpen:false});
                                        } else {
                                            alert("Controlla i calcoli! Devi dividere " + divModal.dividend + " per " + divModal.divisor);
                                        }
                                    }} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-xl shadow-xl hover:bg-indigo-700 transition-all">
                                        APPLICA DIVISIONE
                                    </button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* MODALE FUSION (STESSO STILE) */}
                    <AnimatePresence>
                        {modal.isOpen && (
                            <div className="absolute inset-0 z-[100] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center">
                                <motion.div initial={{y:50}} animate={{y:0}} className="bg-white p-8 rounded-[2.5rem] shadow-2xl w-80 text-center border-4 border-blue-50">
                                    <h3 className="text-slate-400 font-black text-xs uppercase tracking-widest mb-4">Fusione Atomica</h3>
                                    <div className="text-4xl font-black text-blue-600 mb-6 bg-blue-50 py-6 rounded-3xl">
                                        {formatTerm(modal.termA.coefficient, modal.termA.hasVariable)} {modal.termB.coefficient >= 0 ? "+" : ""} {formatTerm(modal.termB.coefficient, modal.termB.hasVariable, false)}
                                    </div>
                                    <input autoFocus type="number" className="w-full bg-slate-100 p-5 rounded-2xl mb-4 text-center text-4xl font-black outline-none focus:ring-4 focus:ring-blue-100" 
                                           value={modal.val} onChange={e => setModal({...modal, val: e.target.value})} />
                                    <button onClick={() => {
                                        if(parseInt(modal.val) === (modal.termA.coefficient + modal.termB.coefficient)) {
                                            setTerms(prev => [...prev.filter(t => t.id !== modal.termA.id && t.id !== modal.termB.id), 
                                                             {id: generateId(), coefficient: parseInt(modal.val), hasVariable: modal.termA.hasVariable, side: modal.termA.side}]);
                                            setModal({isOpen:false});
                                        }
                                    }} className="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-transform">COMBINA</button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* VITTORIA */}
                    <AnimatePresence>
                        {gameWon && (
                            <motion.div initial={{opacity:0}} animate={{opacity:1}} className="absolute inset-0 z-[300] bg-green-500 flex items-center justify-center text-white">
                                <div className="text-center">
                                    <motion.h1 initial={{scale:0.5}} animate={{scale:1}} className="text-8xl font-black mb-4 italic tracking-tighter">BOOM!</motion.h1>
                                    <p className="text-2xl font-bold mb-10 opacity-90 text-green-100">Equazione risolta con successo</p>
                                    <button onClick={() => { setGameWon(false); setTerms(generateLevel(1)); }}
                                            className="bg-white text-green-600 px-16 py-6 rounded-3xl font-black text-3xl shadow-[0_20px_0_rgb(220,220,220)] active:shadow-none active:translate-y-2 transition-all">
                                        PROSSIMA
                                    </button>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        function Card({ term, onDragEnd }) {
            const isL = term.side === 'lhs';
            const pos = useMemo(() => ({
                x: isL ? 60 + Math.random()*80 : window.innerWidth - 180 - Math.random()*80,
                y: 200 + Math.random() * (window.innerHeight - 400)
            }), [term.side]);

            return (
                <motion.div
                    id={`card-${term.id}`}
                    drag dragMomentum={false}
                    initial={{ x: pos.x, y: pos.y, scale: 0 }}
                    animate={{ x: pos.x, y: pos.y, scale: 1, backgroundColor: isL ? LHS_CARD_BG : RHS_CARD_BG }}
                    whileDrag={{ scale: 1.1, zIndex: 100 }}
                    onDragEnd={(e, info) => onDragEnd(term, info, e.target)}
                    className="absolute w-24 h-24 rounded-[2.2rem] card-shadow flex items-center justify-center text-white text-3xl font-black cursor-grab active:cursor-grabbing border-b-8 border-black/20"
                >
                    {formatTerm(term.coefficient, term.hasVariable, false)}
                </motion.div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
